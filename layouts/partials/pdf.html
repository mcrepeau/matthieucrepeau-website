<!-- Spinner CSS -->
<style>
  .spinner {
    border: 8px solid #f3f3f3; /* Half the size */
    border-top: 8px solid #3498db; /* Half the size */
    border-radius: 50%;
    width: 60px; /* Half the size */
    height: 60px; /* Half the size */
    animation: spin 2s linear infinite;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  /* Center the spinner */
  #loading-message {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh; /* Full height of the viewport */
    position: fixed; /* Fixed position */
    top: 0; /* Align to the top */
    left: 0; /* Align to the left */
    width: 100%; /* Full width */
    background: rgba(255, 255, 255, 0.8); /* White background with some transparency */
  }
  </style>

<!-- Container for the PDF -->
<div id="pdf-container"></div>

<!-- Loading message -->
<div id="loading-message">
  <div class="spinner"></div>
</div>

<!-- JavaScript code to load and render the PDF -->
<script type="module">
  import * as pdfjsLib from 'https://unpkg.com/pdfjs-dist@5.5.207/build/pdf.min.mjs';

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@5.5.207/build/pdf.worker.min.mjs';

  const pdfUrl = '{{ .Page.Params.pdf_url }}';

  // Expose download function to global scope for HTML onclick handlers
  window.downloadPDF = function() {
    const link = document.createElement('a');
    link.href = pdfUrl;
    link.download = 'matthieu-crepeau-resume.pdf';
    link.click();
  };

  // Fetch the PDF document
  pdfjsLib.getDocument({ url: pdfUrl }).promise.then(pdf => {
    pdf.getPage(1).then(page => {
      const scale = 1.5;
      const viewport = page.getViewport({ scale });

      const dpr = window.devicePixelRatio || 1;
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.width = viewport.width * dpr;
      canvas.height = viewport.height * dpr;
      canvas.style.width = viewport.width + 'px';
      canvas.style.height = viewport.height + 'px';
      context.scale(dpr, dpr);

      page.render({ canvasContext: context, viewport }).promise.then(() => {
        document.getElementById('pdf-container').appendChild(canvas);

        const textLayerDiv = document.createElement('div');
        textLayerDiv.className = 'textLayer';
        document.getElementById('pdf-container').appendChild(textLayerDiv);

        document.getElementById('loading-message').style.display = 'none';
      });
    });
  });
</script>
